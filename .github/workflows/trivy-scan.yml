name: Trivy Container Scan

on:
  push:
    paths:
      - "frontend/Dockerfile"
      - "backend/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/trivy-scan.yml"
  pull_request:
    paths:
      - "frontend/Dockerfile"
      - "backend/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/trivy-scan.yml"

jobs:
  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t invoicefi-backend:latest -f backend/Dockerfile backend/

      - name: Run Trivy vulnerability scan on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: invoicefi-backend:latest
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: invoicefi-backend:latest
          exit-code: '1'
          severity: CRITICAL

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t invoicefi-frontend:latest -f frontend/Dockerfile frontend/

      - name: Run Trivy vulnerability scan on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: invoicefi-frontend:latest
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: invoicefi-frontend:latest
          exit-code: '1'
          severity: CRITICAL
