name: Fuzz Testing

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  fuzz:
    name: Cargo Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz Mint Target
        run: cargo +nightly fuzz run mint -- -max_total_time=20
        working-directory: contracts/invoice/fuzz

      - name: Fuzz Fund Target
        run: cargo +nightly fuzz run fund -- -max_total_time=20
        working-directory: contracts/invoice/fuzz

      - name: Fuzz Repayment Target
        run: cargo +nightly fuzz run repayment -- -max_total_time=20
        working-directory: contracts/invoice/fuzz
